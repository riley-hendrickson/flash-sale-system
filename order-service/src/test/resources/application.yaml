spring:
  application:
    name: order-service
  config:
    # "optional:" so tests don't hard-fail when no config server is reachable
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8084/realms/flash-sale-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8084/realms/flash-sale-realm

# Only ever supplied by the config server in production; every test needs a
# value so the CommandLineRunner and RestClient @Bean methods on
# OrderServiceApplication can construct.
app:
  discount-rate: 0.1

services:
  inventory-service:
    url: http://localhost:8080
  payment-service:
    url: http://localhost:8082

server:
  port: 8081
